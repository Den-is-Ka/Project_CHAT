services:

  web:
    build: .
    container_name: project-chat-web
    restart: unless-stopped
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py seed_initial &&
      python manage.py collectstatic --noinput &&
      daphne --proxy-headers -b 0.0.0.0 -p 8000 config.asgi:application
      "
    env_file:
      - .env
    environment:
      # В Docker канал WebSocket и кэш должны быть на Redis,
      # чтобы статусы и группы работали у всех workers.
      USE_REDIS_CHANNEL_LAYER: "True"
      REDIS_HOST: redis
      # SQLite-файл и WAL-сайдкары (-wal/-shm) — в постоянном каталоге,
      # чтобы данные переживали пересоздание контейнера.
      DB_PATH: /app/db/db.sqlite3
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # daphne поднимается только после migrate+collectstatic,
      # поэтому проверяем TCP-порт: это и есть признак готовности.
      test:
        - CMD
        - python
        - -c
        - "import socket,sys; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    volumes:
      - ./db:/app/db
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles

  redis:
    image: redis:7-alpine
    container_name: project-chat-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    build: ./nginx
    container_name: project-chat-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro