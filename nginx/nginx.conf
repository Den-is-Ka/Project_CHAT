events {}

http {

    include /etc/nginx/mime.types;

    upstream web {
        server web:8000;
    }

    server {
        listen 80;

        server_name localhost;

        client_max_body_size 20M;

        location /static/ {
            alias /app/staticfiles/;
        }

        # Вложения сообщений всегда проходят авторизацию в Django.
        location /media/chat_files/ {
            proxy_pass http://web;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Только внутренний адрес для X-Accel-Redirect после проверки доступа.
        location /_protected_chat_files/ {
            internal;
            alias /app/media/chat_files/;
            add_header X-Content-Type-Options nosniff always;
        }

        location /media/ {
            alias /app/media/;
        }

        location /ws/ {
            proxy_pass http://web;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass http://web;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
