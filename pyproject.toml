[tool.poetry]
name = "project-chat"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
django = "^6.1"
channels = "^4.3.2"
channels-redis = "^4.3.0"
daphne = "^4.2.3"
pillow = "^12.3.0"
python-dotenv = "^1.2.3"
redis = "7.4.0"
flake8 = "^7.3.0"
isort = "^9.0.1"
black = "^26.5.1"
psycopg = {extras = ["binary"], version = "^3.3.6"}

[tool.poetry.group.dev.dependencies]
ipython = "^9.17.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
# максимальная длина строки
profile = "black"
line_length = 119
skip = [".venv", "venv"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
exclude = "venv/|.venv/|build/|dist/|.mypy_cache/"
